<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
    color:white;
    overflow-x:hidden;
    text-align:center;
}

/* Floating Flowers */
.flower{
    position:fixed;
    top:-50px;
    font-size:24px;
    animation: fall linear infinite;
    opacity:0.8;
}

@keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); }
    100%{ transform: translateY(110vh) rotate(360deg); }
}

/* Main Container */
.container{
    padding:80px 20px;
}

/* Title */
h1{
    font-family: 'Playfair Display', serif;
    font-size:48px;
    margin-bottom:20px;
    animation: fadeIn 2s ease forwards;
}

p{
    font-size:18px;
    max-width:600px;
    margin:0 auto 40px;
    opacity:0;
    animation: fadeIn 3s ease forwards;
    animation-delay:1s;
}

    height:350px;

    border-radius:20px;
